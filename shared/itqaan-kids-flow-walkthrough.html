<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Itqaan kids portal: login flow walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#f5f6fa; --surface:#ffffff; --surface-2:#eef1f7; --ink:#1d2440; --muted:#57607c; --line:#dfe3ee;
  --adult:#1b7f67; --adult-soft:#dcf1ea; --adult-ink:#125a49;
  --kid:#e3a21a; --kid-soft:#fdf0cf; --kid-ink:#6f4a00;
  --stop:#b8432c; --stop-soft:#fbe3dd;
  --shadow:0 1px 2px rgba(29,36,64,.06), 0 16px 40px rgba(29,36,64,.10);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#11152a; --surface:#1a1f3a; --surface-2:#232a4a; --ink:#edf0f9; --muted:#a6aecb; --line:#2e3658;
    --adult:#4ec3a1; --adult-soft:#163a33; --adult-ink:#8ee0c6;
    --kid:#f3b937; --kid-soft:#3b3017; --kid-ink:#f7d27a;
    --stop:#f0846c; --stop-soft:#3f2420;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 16px 40px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#11152a; --surface:#1a1f3a; --surface-2:#232a4a; --ink:#edf0f9; --muted:#a6aecb; --line:#2e3658;
  --adult:#4ec3a1; --adult-soft:#163a33; --adult-ink:#8ee0c6;
  --kid:#f3b937; --kid-soft:#3b3017; --kid-ink:#f7d27a;
  --stop:#f0846c; --stop-soft:#3f2420;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 16px 40px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,h4{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;line-height:1.12;margin:0;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--kid);outline-offset:2px}
.url{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.88em}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}

/* top */
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 0 10px;flex-wrap:wrap}
.top h1{font-size:1.35rem;font-weight:800}
.top .meta{color:var(--muted);font-size:.95rem}
.progress{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.progress b{display:block;height:100%;width:0;background:var(--adult);border-radius:999px;transition:width .35s ease,background .35s}
.progress.kid b{background:var(--kid)}

/* stage */
.stage{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:36px;margin-top:28px;align-items:start}
.narr{position:sticky;top:24px}
.who{display:inline-flex;align-items:center;gap:10px;font-weight:700;border-radius:999px;padding:6px 14px 6px 6px}
.who.adult{background:var(--adult-soft);color:var(--adult-ink)}
.who.kid{background:var(--kid-soft);color:var(--kid-ink)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.85rem;flex:none}
.av.a{background:var(--adult);color:#fff}
.av.y{background:var(--kid);color:#2a1d00}
.av.m{background:#9a7fd1;color:#fff}
.narr h2{font-size:clamp(1.8rem,3.2vw,2.5rem);font-weight:800;margin-top:18px}
.narr .text{margin-top:14px;color:var(--muted);font-size:1.08rem}
.narr .text strong{color:var(--ink)}
.points{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:10px}
.points li{display:flex;gap:10px;align-items:baseline}
.points li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--adult);flex:none;transform:translateY(-2px)}
.stage.kid .points li::before{background:var(--kid)}
.where{margin-top:20px;display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px;color:var(--muted)}
.anim{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.anim{animation:none}.progress b{transition:none}}

/* browser */
.device{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;background:var(--surface-2);padding:12px 16px}
.bar i{width:11px;height:11px;border-radius:50%;background:var(--line);display:block}
.addr{flex:1;margin-left:8px;background:var(--surface);border-radius:999px;padding:6px 14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addr s{color:var(--stop)}
.app{min-height:520px;display:flex;flex-direction:column}
.nav{display:flex;align-items:center;gap:18px;padding:14px 24px;border-bottom:1px solid var(--line)}
.logo{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.2rem}
.logo span{color:var(--adult)}
.nav.kidnav .logo span{color:var(--kid)}
.nav .links{display:flex;gap:16px;color:var(--muted);font-weight:600;font-size:.95rem;flex:1;flex-wrap:wrap}
.nav .links .on{color:var(--ink)}
.page{padding:28px;display:flex;flex-direction:column;gap:18px;flex:1}
.page h3{font-size:1.55rem}
.hint{color:var(--muted)}
.field label{display:block;font-weight:700;font-size:.9rem;margin-bottom:6px}
.input{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:11px 14px;color:var(--ink)}
.input.ph{color:var(--muted)}
.pin{display:flex;gap:10px}
.pin span{width:52px;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;font-size:1.4rem}
.btn{display:inline-block;border-radius:12px;padding:11px 20px;font-weight:700;text-align:center}
.btn.a{background:var(--adult);color:#fff}
.btn.k{background:var(--kid);color:#2a1d00}
.btn.g{background:var(--surface-2)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.chip{background:var(--surface-2);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.92rem}
.tag{font-size:.82rem;font-weight:700;padding:3px 10px;border-radius:999px;display:inline-block}
.tag.a{background:var(--adult-soft);color:var(--adult-ink)} .tag.k{background:var(--kid-soft);color:var(--kid-ink)}
.card{border:1px solid var(--line);border-radius:16px;padding:18px;background:var(--surface)}
.hl{outline:3px solid var(--kid);outline-offset:3px;border-radius:16px}
.cols{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}
.courses{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.course{border-radius:16px;padding:16px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;font-weight:700}
.course small{font-weight:500;opacity:.85}
.course.ad{background:var(--adult-soft);color:var(--adult-ink)}
.course.kd{background:var(--kid-soft);color:var(--kid-ink)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:4px;font-weight:700;font-size:.9rem}
.seg span{padding:6px 14px;border-radius:999px;color:var(--muted)}
.seg .on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.kidrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.kidrow:last-child{border-bottom:0}
.kidrow .nm{font-weight:700;flex:1}
.kidrow .sm{color:var(--muted);font-size:.88rem;display:block;font-weight:500}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 20px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:700}
.track{height:12px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:6px}
.track b{display:block;height:100%;background:var(--adult);border-radius:999px}
.cl{display:grid;gap:12px;margin-top:10px}
.menu{align-self:flex-end;width:250px;border:1px solid var(--line);border-radius:16px;padding:8px;background:var(--surface);box-shadow:var(--shadow)}
.menu div{padding:10px 12px;border-radius:10px}
.menu .on{background:var(--kid-soft);color:var(--kid-ink);font-weight:700}
.toast{display:flex;gap:12px;align-items:center;background:var(--stop-soft);color:var(--stop);border-radius:14px;padding:12px 16px;font-weight:600}
.hero-k{background:linear-gradient(135deg,var(--kid-soft),var(--surface));border-radius:20px;padding:36px;display:flex;flex-direction:column;gap:14px}
.hero-k h3{font-size:2.1rem}
.success{display:flex;gap:12px;align-items:center;background:var(--adult-soft);color:var(--adult-ink);border-radius:14px;padding:12px 16px;font-weight:700}

/* intro + end */
.full{margin-top:28px}
.intro{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center}
.intro h2{font-size:clamp(2.2rem,5vw,3.8rem);font-weight:800;max-width:14ch}
.intro .text{margin-top:18px;font-size:1.15rem;color:var(--muted);max-width:52ch}
.cast{display:grid;gap:14px}
.person{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.person .av{width:56px;height:56px;font-size:1.1rem}
.person b{display:block;font-size:1.1rem}
.person span{color:var(--muted)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:24px}
.qgroup{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px}
.qgroup h3{font-size:1.2rem}
.qgroup ol{margin:14px 0 0;padding-left:1.4em;display:grid;gap:12px}
.qgroup li::marker{font-weight:800;color:var(--muted)}
.qgroup li.flag{background:var(--kid-soft);color:var(--kid-ink);border-radius:12px;padding:10px 12px}
.recap{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:20px}
.recap .card h4{font-size:1.05rem;margin-bottom:6px}
.recap .card p{color:var(--muted)}

/* bottom nav */
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.navbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:14px;padding-bottom:14px}
.navbtn{border:0;border-radius:14px;padding:12px 24px;font-weight:700;font-size:1rem}
#back{background:var(--surface-2)}
#next{background:var(--adult);color:#fff;min-width:150px}
.navbar.kid #next{background:var(--kid);color:#2a1d00}
.navbtn:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.dots button{width:11px;height:11px;border-radius:50%;border:0;padding:0;background:var(--line)}
.dots button.done{background:color-mix(in srgb,var(--adult) 55%,var(--line))}
.dots button.kd.done{background:color-mix(in srgb,var(--kid) 60%,var(--line))}
.dots button[aria-current="step"]{background:var(--ink);transform:scale(1.25)}
.keys{color:var(--muted);font-size:.85rem}

@media (max-width:900px){
  .stage,.intro,.cols{grid-template-columns:1fr}
  .narr{position:static}
  .app{min-height:0}
  .keys{display:none}
  .dots{display:none}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <h1>Itqaan kids portal: login flow</h1>
    <span class="meta" id="counter">Step 1 of 14</span>
  </div>
  <div class="progress" id="progress"><b id="bar"></b></div>
  <main id="main" aria-live="polite"></main>
</div>

<nav class="navbar" id="navbar" aria-label="Walkthrough">
  <div class="wrap">
    <button type="button" class="navbtn" id="back">Back</button>
    <div class="dots" id="dots"></div>
    <div class="row">
      <span class="keys">Use ← → keys</span>
      <button type="button" class="navbtn" id="next">Next</button>
    </div>
  </div>
</nav>

<script>
(function(){
  var A = '<span class="av a">AR</span>';
  var Y = '<span class="av y">YA</span>';
  var M = '<span class="av m">MA</span>';

  function adultNav(active){
    var items = ['Dashboard','My courses','My kids','Kids progress'];
    return '<div class="nav"><div class="logo">Itqaan<span>.</span></div><div class="links">'+
      items.map(function(i){ return '<span class="'+(i===active?'on':'')+'">'+i+'</span>'; }).join('')+
      '</div>'+A+'</div>';
  }
  function kidNav(){
    return '<div class="nav kidnav"><div class="logo">Itqaan NextGen<span>.</span></div><div class="links"><span class="on">My courses</span></div>'+Y+'</div>';
  }

  var steps = [
    { type:'intro', who:'adult' },

    { who:'adult', title:'Abdullah logs in with his normal account',
      text:'There is <strong>one adult account</strong>. Parent tools are part of it, so there is no separate parent sign-up.',
      points:['Same login page for every adult','No extra setup to become a parent'],
      url:'itqaan.org/login',
      app:'<div class="nav"><div class="logo">Itqaan<span>.</span></div></div>'+
          '<div class="page" style="max-width:460px">'+
          '<h3>Welcome back</h3><p class="hint">Log in to your Itqaan account.</p>'+
          '<div class="field"><label>Email</label><div class="input">abdullah.rahman@example.com</div></div>'+
          '<div class="field"><label>Password</label><div class="input">••••••••••</div></div>'+
          '<span class="btn a" style="align-self:flex-start">Log in</span></div>' },

    { who:'adult', title:'His dashboard shows adult and kids courses',
      text:'The adult dashboard has both course types. A <strong>My kids</strong> panel sits on the side, ready for him to add his children.',
      points:['Adult courses for himself','Kids courses he can browse for his children','My kids panel with "Add a kid"'],
      url:'itqaan.org/dashboard',
      app: adultNav('Dashboard')+
          '<div class="page"><h3>Assalamu alaikum, Abdullah</h3>'+
          '<div class="cols"><div style="display:grid;gap:14px">'+
          '<div class="seg"><span class="on">Adult courses</span><span>Kids courses</span></div>'+
          '<div class="courses"><div class="course ad">Tajweed Level 2<small>Continue · 40%</small></div><div class="course ad">Seerah Essentials<small>Start</small></div></div>'+
          '</div>'+
          '<div class="card hl"><div class="row between"><h4>My kids</h4><span class="tag a">0 kids</span></div>'+
          '<p class="hint" style="margin:10px 0 14px">Add your children so they can learn on Itqaan NextGen.</p>'+
          '<span class="btn a">Add a kid</span></div>'+
          '</div></div>' },

    { who:'adult', title:'He adds his son Yusuf',
      text:'Abdullah fills in a short form. He picks <strong>Yusuf’s username, email and a 4-digit PIN</strong>.',
      points:['Every kid account is created by a parent','The kid is linked to Abdullah’s account'],
      url:'itqaan.org/dashboard/kids/add',
      app: adultNav('My kids')+
          '<div class="page" style="max-width:520px"><h3>Add a kid</h3>'+
          '<div class="field"><label>Kid’s name</label><div class="input">Yusuf</div></div>'+
          '<div class="field"><label>Username</label><div class="input">yusuf.abdullah</div></div>'+
          '<div class="field"><label>Email</label><div class="input">yusuf@example.com</div></div>'+
          '<div class="field"><label>PIN (4 digits)</label><div class="pin"><span>•</span><span>•</span><span>•</span><span>•</span></div></div>'+
          '<span class="btn a" style="align-self:flex-start">Add kid</span></div>' },

    { who:'adult', title:'Yusuf’s account is ready',
      text:'Itqaan shows the login details. Abdullah <strong>shares them with Yusuf</strong>, then adds his daughter Maryam the same way.',
      points:['Login details shown once, ready to copy','One parent can add many kids'],
      url:'itqaan.org/dashboard/kids',
      app: adultNav('My kids')+
          '<div class="page"><div class="success">✓ Yusuf’s account is ready</div>'+
          '<div class="card"><h4 style="margin-bottom:12px">Share with Yusuf</h4><dl class="kv"><dt>Log in at</dt><dd class="url">itqaan.org/nextgen</dd><dt>Username</dt><dd>yusuf.abdullah</dd><dt>PIN</dt><dd>••••</dd></dl></div>'+
          '<div class="row"><span class="btn a">Copy details</span><span class="btn g hl">Add another kid</span></div></div>' },

    { who:'adult', title:'All his kids in one place',
      text:'<strong>My kids</strong> lists every child linked to Abdullah. From here he can view progress or manage each account.',
      points:['Yusuf and Maryam each have their own login','Each kid has separate progress'],
      url:'itqaan.org/dashboard/kids',
      app: adultNav('My kids')+
          '<div class="page"><div class="row between"><h3>My kids</h3><span class="btn a">Add a kid</span></div>'+
          '<div class="card">'+
          '<div class="kidrow">'+Y+'<span class="nm">Yusuf<span class="sm">yusuf.abdullah</span></span><span class="btn g hl">View progress</span></div>'+
          '<div class="kidrow">'+M+'<span class="nm">Maryam<span class="sm">maryam.abdullah</span></span><span class="btn g">View progress</span></div>'+
          '</div></div>' },

    { who:'adult', title:'He checks his kids’ progress',
      text:'The <strong>Kids progress</strong> page shows how far each child has got in every kids course.',
      points:['One view for all his kids','Only Abdullah can see this page'],
      url:'itqaan.org/child/progress',
      app: adultNav('Kids progress')+
          '<div class="page"><h3>Kids progress</h3>'+
          '<div class="card"><div class="row">'+Y+'<b>Yusuf</b></div><div class="cl">'+
            '<div><div class="row between"><span>Noorani Qaida</span><span class="hint">50% completed</span></div><div class="track"><b style="width:50%"></b></div></div>'+
            '<div><div class="row between"><span>Short Surahs</span><span class="hint">20% completed</span></div><div class="track"><b style="width:20%"></b></div></div>'+
          '</div></div>'+
          '<div class="card"><div class="row">'+M+'<b>Maryam</b></div><div class="cl">'+
            '<div><div class="row between"><span>Noorani Qaida</span><span class="hint">80% completed</span></div><div class="track"><b style="width:80%"></b></div></div>'+
          '</div></div></div>' },

    { who:'kid', title:'Now Yusuf opens the kids portal',
      text:'Yusuf goes to <strong>itqaan.org/nextgen</strong> on his tablet. This is the kids home page.',
      points:['Separate home page made for kids','Parents can open it too'],
      url:'itqaan.org/nextgen',
      app: kidNav().replace(Y,'<span class="btn k" style="padding:8px 16px">Log in</span>')+
          '<div class="page"><div class="hero-k"><span class="tag k" style="align-self:flex-start">Itqaan NextGen</span><h3>Learning made for kids</h3><p class="hint">Qur’an, duas and stories, one small step at a time.</p><span class="btn k hl" style="align-self:flex-start">Log in</span></div></div>' },

    { who:'kid', title:'He logs in with his own details',
      text:'Yusuf enters the <strong>username and PIN</strong> his father set up. He never needs Abdullah’s password.',
      points:['Username or email, plus a 4-digit PIN','Kid logins only work on /nextgen'],
      url:'itqaan.org/nextgen/login',
      app: '<div class="nav kidnav"><div class="logo">Itqaan NextGen<span>.</span></div></div>'+
          '<div class="page" style="max-width:460px"><h3>Assalamu alaikum!</h3><p class="hint">Log in to start learning.</p>'+
          '<div class="field"><label>Username or email</label><div class="input">yusuf.abdullah</div></div>'+
          '<div class="field"><label>PIN</label><div class="pin"><span>•</span><span>•</span><span>•</span><span>•</span></div></div>'+
          '<span class="btn k" style="align-self:flex-start">Log in</span></div>' },

    { who:'kid', title:'He sees only kids courses',
      text:'Yusuf’s dashboard shows <strong>kids courses only</strong>. Adult courses never appear here.',
      points:['His own progress, separate from Maryam’s','No parent menu or links'],
      url:'itqaan.org/nextgen/dashboard',
      app: kidNav()+
          '<div class="page"><h3>Assalamu alaikum, Yusuf!</h3>'+
          '<div class="courses"><div class="course kd">Noorani Qaida<small>Continue · 50%</small></div><div class="course kd">Short Surahs<small>Continue · 20%</small></div><div class="course kd">Duas for Kids<small>Start</small></div></div></div>' },

    { who:'kid', title:'He opens a course',
      text:'Course pages for kids live under <strong>/nextgen</strong> too, so Yusuf stays inside the kids portal.',
      points:['Lessons, audio and quizzes made for kids'],
      url:'itqaan.org/nextgen/course/101',
      app: kidNav()+
          '<div class="page"><span class="tag k" style="align-self:flex-start">Noorani Qaida</span><h3>Lesson 6: Joined letters</h3>'+
          '<div class="card"><div class="row between"><span>Lesson progress</span><span class="hint">3 of 5 parts</span></div><div class="track"><b style="width:60%;background:var(--kid)"></b></div></div>'+
          '<div class="row"><span class="btn k">Continue lesson</span><span class="btn g">Listen again</span></div></div>' },

    { who:'kid', title:'He can’t reach his father’s pages',
      text:'If Yusuf types a parent address, like <strong>itqaan.org/dashboard</strong>, he is sent straight back to his own dashboard.',
      points:['Every parent page is blocked for kid logins','No way to switch into the adult account'],
      url:'<s>itqaan.org/dashboard</s> → itqaan.org/nextgen/dashboard',
      app: kidNav()+
          '<div class="page"><div class="toast">That page is for parents. You’re back on your dashboard.</div><h3>Assalamu alaikum, Yusuf!</h3>'+
          '<div class="courses"><div class="course kd">Noorani Qaida<small>Continue · 50%</small></div><div class="course kd">Short Surahs<small>Continue · 20%</small></div><div class="course kd">Duas for Kids<small>Start</small></div></div></div>' },

    { who:'kid', title:'When he’s done, he logs out',
      text:'The kids menu has <strong>no “Switch to parent” option</strong>. Logging out is the only way out.',
      points:['After logging out, Yusuf lands on itqaan.org/nextgen'],
      url:'itqaan.org/nextgen/dashboard',
      app: kidNav()+
          '<div class="page"><div class="menu"><div>My courses</div><div>My badges</div><div class="on">Log out</div></div></div>' },

    { type:'end', who:'adult' }
  ];

  var main = document.getElementById('main');
  var counter = document.getElementById('counter');
  var bar = document.getElementById('bar'), progress = document.getElementById('progress');
  var navbar = document.getElementById('navbar');
  var back = document.getElementById('back'), next = document.getElementById('next');
  var dots = document.getElementById('dots');
  var i = 0;

  steps.forEach(function(s, k){
    var d = document.createElement('button');
    d.type = 'button';
    d.setAttribute('aria-label','Go to step '+(k+1));
    if(s.who === 'kid') d.className = 'kd';
    d.addEventListener('click', function(){ go(k); });
    dots.appendChild(d);
  });

  function whoChip(s){
    return s.who === 'kid'
      ? '<span class="who kid">'+Y+'Yusuf, 9 · kid account</span>'
      : '<span class="who adult">'+A+'Abdullah · adult account</span>';
  }

  function renderIntro(){
    return '<section class="full intro anim">'+
      '<div><h2>One adult account. Kids get their own login.</h2>'+
      '<p class="text">Follow one family through the proposed flow. Abdullah uses his normal Itqaan account, creates accounts for his kids, and tracks their progress. His son Yusuf logs in to the kids portal and stays there.</p></div>'+
      '<div class="cast">'+
        '<div class="person"><span class="av a">AR</span><div><b>Abdullah Rahman</b><span>Parent, adult account at itqaan.org</span></div></div>'+
        '<div class="person"><span class="av y">YA</span><div><b>Yusuf</b><span>Son, kid account at itqaan.org/nextgen</span></div></div>'+
        '<div class="person"><span class="av m">MA</span><div><b>Maryam</b><span>Daughter, kid account at itqaan.org/nextgen</span></div></div>'+
      '</div></section>';
  }

  function renderEnd(){
    return '<section class="full anim">'+
      '<h2 style="font-size:clamp(2rem,4vw,3rem);font-weight:800">What we need from you</h2>'+
      '<p class="hint" style="margin-top:10px;max-width:62ch">That’s the full flow. Please answer these questions so we can lock it in.</p>'+
      '<div class="recap">'+
        '<div class="card"><h4>Adult account</h4><p>One login for adults, with parent tools built in.</p></div>'+
        '<div class="card"><h4>Kid accounts</h4><p>Created by the parent. Username or email, plus a PIN.</p></div>'+
        '<div class="card"><h4>Kids portal</h4><p>Kids courses only. No path to parent pages.</p></div>'+
        '<div class="card"><h4>Progress</h4><p>Parents see each kid’s progress in one place.</p></div>'+
      '</div>'+
      '<div class="qgrid">'+
        '<div class="qgroup"><h3>Accounts</h3><ol>'+
          '<li class="flag">Earlier you said kids should not log in without a parent. In this flow, kids log in on their own with details the parent creates. Is that okay?</li>'+
          '<li>Must every kid account belong to a parent, or can a kid sign up alone?</li>'+
          '<li>Many kids have no email. Can a parent use their own email for a kid? If yes, kids would log in with a username.</li>'+
          '<li>Can one kid be linked to two parents, for example both mother and father?</li>'+
          '<li>Is there an age limit? When a kid grows up, should their account move to the adult portal?</li>'+
        '</ol></div>'+
        '<div class="qgroup"><h3>Courses and payment</h3><ol start="6">'+
          '<li>Can kids buy courses themselves, or only parents?</li>'+
          '<li>If a parent buys a kids course, does each kid need their own purchase, or can all their kids use it?</li>'+
          '<li>Can kids join free kids courses on their own?</li>'+
        '</ol></div>'+
        '<div class="qgroup"><h3>Login, safety and progress</h3><ol start="9">'+
          '<li>If a kid forgets their PIN, should only the parent be able to reset it?</li>'+
          '<li>Should a parent be able to pause or delete a kid’s account?</li>'+
          '<li>When a parent opens /nextgen while logged in, should they see a general kids view, or view as one of their kids?</li>'+
          '<li>Besides completion %, what should parents see? For example lessons done, quiz scores, time spent, last active.</li>'+
        '</ol></div>'+
      '</div></section>';
  }

  function renderStep(s){
    return '<section class="stage '+s.who+'">'+
      '<div class="narr anim">'+whoChip(s)+
        '<h2>'+s.title+'</h2><p class="text">'+s.text+'</p>'+
        '<ul class="points">'+s.points.map(function(p){return '<li>'+p+'</li>';}).join('')+'</ul>'+
      '</div>'+
      '<div class="device anim"><div class="bar"><i></i><i></i><i></i><span class="addr url">'+s.url+'</span></div>'+
        '<div class="app">'+s.app+'</div></div>'+
      '</section>';
  }

  function go(k){
    i = Math.max(0, Math.min(steps.length - 1, k));
    var s = steps[i];
    main.innerHTML = s.type === 'intro' ? renderIntro() : s.type === 'end' ? renderEnd() : renderStep(s);
    counter.textContent = 'Step '+(i+1)+' of '+steps.length;
    bar.style.width = ((i+1)/steps.length*100)+'%';
    var isKid = s.who === 'kid';
    progress.classList.toggle('kid', isKid);
    navbar.classList.toggle('kid', isKid);
    back.disabled = i === 0;
    next.disabled = i === steps.length - 1;
    next.textContent = i === 0 ? 'Start' : (i === steps.length - 2 ? 'See questions' : 'Next');
    Array.prototype.forEach.call(dots.children, function(d, j){
      d.classList.toggle('done', j < i);
      if(j === i) d.setAttribute('aria-current','step'); else d.removeAttribute('aria-current');
    });
    window.scrollTo({top:0, behavior:'auto'});
  }

  back.addEventListener('click', function(){ go(i - 1); });
  next.addEventListener('click', function(){ go(i + 1); });
  document.addEventListener('keydown', function(e){
    if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if(e.key === 'ArrowRight') go(i + 1);
    if(e.key === 'ArrowLeft') go(i - 1);
  });
  go(0);
})();
</script>
</body>
</html>
